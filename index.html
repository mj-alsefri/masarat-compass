<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوصلة التطوع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Masarat = "paths". The page is built on one motif: a trail with stations.
   It carries progress, the role list, and the section breaks. Navy is the
   bold surface and holds the compass; the questions sit on light paper. */
:root{
  --ink:#0e2a3c;        /* navy, from the logo blue pushed down */
  --ink-2:#17405a;      /* raised navy, for fields on navy */
  --blue:#3c8bb7;       /* logo blue */
  --blue-deep:#256388;  /* logo blue, for text and buttons on paper */
  --amber:#f3ab0d;      /* logo amber */
  --paper:#edf2f5;
  --line:#cbd9e2;
  --graphite:#55606a;
  --sand:#fbeed0;
  --warn:#a8450a;
  --d:"Changa","Readex Pro",system-ui,sans-serif;
  --b:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--b);font-weight:400;font-size:16.5px;line-height:1.75;
  -webkit-text-size-adjust:100%;transition:background-color .35s ease}
body[data-screen="welcome"],body[data-screen="result"]{background:var(--ink);color:#fff}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue-deep)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
h1,h2,h3{font-family:var(--d);font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.wrap{max-width:672px;margin:0 auto;padding:0 18px 44px;min-height:100%;display:flex;flex-direction:column}

/* masthead */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.top .brand{display:flex;align-items:center;gap:11px;font-family:var(--d);font-weight:700;font-size:18px}
.top .brand svg{width:70px;height:32px;display:block}
.top .restart{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 15px;font-size:14px;color:var(--graphite)}
.top .restart:hover{border-color:var(--blue-deep);color:var(--blue-deep)}
body[data-screen="result"] .top .restart{border-color:rgba(255,255,255,.3);color:#cfe0ea}
body[data-screen="result"] .top .restart:hover{border-color:var(--amber);color:var(--amber)}

/* the trail: three stations, the rail fills with progress */
.trail{position:relative;height:36px;margin:16px 0 30px}
.trail .rail{position:absolute;top:5px;right:0;left:0;height:2px;background:var(--line);border-radius:2px}
.trail .rail i{position:absolute;top:0;right:0;height:100%;background:var(--amber);border-radius:2px;transition:width .35s ease}
.trail b{position:absolute;top:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.trail b.done{background:var(--amber);border-color:var(--amber)}
.trail b.now{background:#fff;border-color:var(--amber);box-shadow:0 0 0 4px rgba(243,171,13,.2)}
.trail .name{position:absolute;top:19px;font-size:13px;white-space:nowrap;color:var(--graphite);font-weight:300}
.trail .name.on{color:var(--ink);font-weight:500}

/* ---------- welcome ---------- */
.hero{display:grid;gap:21px;padding-top:6px}
.hero .who{display:grid;gap:3px}
.hero .who svg{width:96px;height:44px}
.hero .who span{font-size:14.5px;color:#a9c3d3;font-weight:300}
.hero h1{font-family:var(--d);font-size:clamp(37px,10.2vw,58px);line-height:1.1;color:#fff;letter-spacing:-.01em}
.hero p{font-size:17.5px;color:#d3e2eb;font-weight:300;max-width:27em;line-height:1.65}
.hero .rose{display:block;width:100%;height:auto;max-height:min(33vh,246px)}
.hero .where{font-size:13.5px;color:#8fb0c4;font-weight:300;line-height:1.65}
.go{display:inline-flex;align-items:center;justify-content:center;background:var(--amber);color:#10293a;border:0;
  border-radius:16px;padding:15px 34px;font-family:var(--d);font-size:22px;font-weight:700;min-height:60px;width:100%}
.go:hover{background:#ffbe30}
.go[disabled]{background:#8aa3b3;color:#e8f0f5;cursor:not-allowed}
.go.quiet{background:none;color:#cfe0ea;border:1.5px solid rgba(255,255,255,.3);font-size:18px;min-height:52px;padding:10px 24px;width:auto}
.go.quiet:hover{border-color:var(--amber);color:var(--amber);background:none}

/* ---------- question screens ---------- */
.screen{display:grid;gap:24px}
.screen.one{min-height:calc(100vh - 216px);align-content:center}
@supports (height:100dvh){.screen.one{min-height:calc(100dvh - 216px)}}
.screen h2{font-size:27px}
.screen .lead{color:var(--graphite);font-size:16px;margin-top:-16px;font-weight:300}
fieldset{border:0;padding:0;margin:0;display:grid;gap:11px;min-width:0}
legend{padding:0;font-family:var(--d);font-weight:600;font-size:19px;margin-bottom:9px;color:var(--ink)}
legend em{font-style:normal;font-family:var(--b);font-weight:300;color:var(--graphite);font-size:14.5px}
.pick{display:flex;flex-wrap:wrap;gap:9px}
.pick.rows{display:grid}
.pick.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick button{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:11px 16px;min-height:50px;
  text-align:start;line-height:1.5;font-size:16px;transition:border-color .15s,background-color .15s}
.pick button:hover{border-color:var(--blue)}
.pick button small{display:block;font-size:13.5px;color:var(--graphite);font-weight:300}
.pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pick button[aria-disabled="true"]{opacity:.42}
.pick button[aria-disabled="true"]:hover{border-color:var(--line)}
.pick button[aria-pressed="true"] small{color:#b9cedb}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.back{background:none;border:0;padding:8px 2px;color:var(--graphite);font-size:15.5px;text-decoration:underline;
  text-underline-offset:4px;min-height:44px}
.back:hover{color:var(--blue-deep)}
.next{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:12px 30px;font-family:var(--d);
  font-size:19px;font-weight:600;min-height:54px}
.next:hover{background:#1c4a66}
.next[disabled]{background:#b4c5d1;cursor:not-allowed}
.next.lit{background:var(--amber);color:#10293a}
.next.lit:hover{background:#ffbe30}

/* the bearing dial */
.count{font-size:14px;color:var(--graphite);font-variant-numeric:tabular-nums;font-weight:300}
.statement{font-family:var(--d);font-weight:600;font-size:clamp(26px,6.6vw,35px);line-height:1.45;min-height:2.9em}
.dial{display:grid;gap:10px}
.dial .stops{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dial button{border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;
  font-family:var(--d);font-weight:600;font-size:19px;color:var(--graphite);flex:none;
  transition:transform .12s,background-color .15s,border-color .15s,color .15s}
.dial button[data-val="1"],.dial button[data-val="5"]{width:60px;height:60px}
.dial button[data-val="2"],.dial button[data-val="4"]{width:53px;height:53px}
.dial button[data-val="3"]{width:46px;height:46px;font-size:17px}
.dial button:hover{border-color:var(--blue);color:var(--blue-deep)}
.dial button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#10293a;transform:scale(1.06)}
.dial .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--graphite);font-weight:300}
.dial .ends span:nth-child(2){text-align:center}
.dial .ends span:last-child{text-align:end}

/* contact step */
.field{display:grid;gap:7px}
.field label{font-weight:500;font-size:16.5px}
.field input{font:inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;background:#fff;
  color:var(--ink);min-height:54px;width:100%}
.field input:focus{border-color:var(--blue)}
.field input.tel{direction:ltr;text-align:right}
.field .bad{color:var(--warn);font-size:14.5px}
.consent{font-size:14.5px;color:var(--graphite);font-weight:300}

/* ---------- result ---------- */
.result{display:grid;gap:26px;padding-top:6px}
.bearing{display:grid;gap:14px}
.bearing .lead{color:#a9c3d3;font-size:15px;font-weight:300}
.bearing h2{font-family:var(--d);font-size:clamp(38px,10.5vw,56px);line-height:1.12;color:var(--amber)}
.bearing h2 span{color:#fff}
.bearing .says{font-size:18px;color:#d3e2eb;font-weight:300;max-width:28em}
.bearing .rose{display:block;width:100%;height:auto;max-height:340px;margin:2px 0}
.bearing .level{border-top:1px solid rgba(255,255,255,.17);padding-top:15px;display:grid;gap:3px}
.bearing .level b{font-family:var(--d);font-size:22px;color:var(--amber);font-weight:700}
.bearing .level span{color:#bed3df;font-size:15.5px;font-weight:300}
.needle{transition:transform 1.4s cubic-bezier(.32,1.4,.5,1);transform-origin:0 0}

.panel{background:var(--paper);color:var(--ink);border-radius:26px;padding:24px 20px;display:grid;gap:26px}
.panel h3{font-size:22px}
.panel .sub{color:var(--graphite);font-size:14.5px;font-weight:300;margin-top:-10px}
/* roles as stations on a trail */
.roles{list-style:none;margin:14px 0 0;padding:0 20px 0 0;position:relative;display:grid;gap:20px}
.roles::before{content:"";position:absolute;top:8px;bottom:8px;right:4px;width:2px;background:#b7ccd9}
.roles li{position:relative;display:grid;gap:3px}
.roles li::before{content:"";position:absolute;top:7px;right:-20px;width:10px;height:10px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 0 4px var(--paper)}
.roles .t{font-family:var(--d);font-weight:600;font-size:19px;line-height:1.4}
.roles .s{font-size:15px;color:var(--ink);font-weight:300;line-height:1.6}
.roles .meta{font-size:13.5px;color:var(--graphite);font-weight:300}
.gap{font-size:14px;color:var(--graphite);font-weight:300;border-top:1px solid var(--line);padding-top:12px}
.tip{background:var(--sand);border-radius:18px;padding:17px 19px;display:grid;gap:7px}
.tip h3{font-size:19px}
.tip p{font-size:15.5px;font-weight:300}
.reg{display:grid;gap:13px}
.reg .row{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;border:1.5px solid var(--line);
  border-radius:18px;padding:15px}
.reg .row.first{border-color:var(--blue-deep)}
.reg .row h4{margin:0;font-family:var(--d);font-weight:600;font-size:18px}
.reg .row p{font-size:14.5px;color:var(--graphite);font-weight:300;margin:4px 0 11px}
.reg .row a{display:inline-flex;align-items:center;justify-content:center;background:var(--blue-deep);color:#fff;
  border-radius:12px;padding:10px 22px;min-height:48px;font-family:var(--d);font-weight:600;font-size:17px;text-decoration:none}
.reg .row a:hover{background:var(--ink)}
.reg .row.second a{background:none;color:var(--blue-deep);border:1.5px solid var(--line)}
.reg .row.second a:hover{background:var(--blue-deep);color:#fff;border-color:var(--blue-deep)}
.reg svg{width:98px;height:98px;display:block;background:#fff;border-radius:6px}
.close{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.close svg{width:118px;height:76px}
.fine{font-size:12.5px;color:#8fb0c4;font-weight:300;line-height:1.8}

/* ---------- report ---------- */
.report{display:grid;gap:20px}
.report h2{font-size:26px}
.scopes{display:flex;flex-wrap:wrap;gap:8px}
.scopes button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 17px;min-height:44px;font-size:15px}
.scopes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.range{display:flex;flex-wrap:wrap;gap:12px}
.range .field{flex:1 1 150px}
.range input{min-height:46px;padding:9px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tile{background:var(--paper);padding:13px 16px}
.tile b{display:block;font-family:var(--d);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.25}
.tile span{font-size:13px;color:var(--graphite);font-weight:300}
.chart{display:grid;gap:9px}
.chart h3{font-size:18px}
.bar{display:grid;grid-template-columns:minmax(94px,32%) 1fr 66px;gap:10px;align-items:center;font-size:14.5px;font-weight:300}
.bar .track{height:12px;background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--blue)}
.bar .n{font-variant-numeric:tabular-nums;color:var(--graphite);text-align:end;font-size:13.5px}
.export{border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:13px}
.export .btns{display:flex;flex-wrap:wrap;gap:10px}
.export button{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:10px 20px;min-height:48px;
  font-family:var(--d);font-weight:600;font-size:16px}
.export button:hover{background:#1c4a66}
.export button[disabled]{background:#b4c5d1;cursor:not-allowed}
.export button.alt{background:none;color:var(--blue-deep);border:1.5px solid var(--line);font-family:var(--b);font-weight:400}
.export button.alt:hover{background:#fff;border-color:var(--blue-deep)}
.said{font-size:14.5px;color:var(--graphite);font-weight:300}
.said.warn{color:var(--warn)}
.notice{background:var(--sand);border-radius:14px;padding:13px 16px;font-size:15px;font-weight:300}

.shelf{margin-top:auto;padding-top:28px;font-size:13.5px;color:var(--graphite);display:flex;flex-wrap:wrap;
  gap:6px 14px;align-items:center;font-weight:300}
.shelf .live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1f8a5b;margin-inline-end:7px}
.shelf .live.hold{background:var(--amber)}
.shelf button{background:none;border:0;padding:0;color:var(--blue-deep);text-decoration:underline;
  text-underline-offset:3px;font-size:13.5px}
body[data-screen="welcome"] .shelf,body[data-screen="result"] .shelf{color:#8fb0c4}
body[data-screen="welcome"] .shelf button,body[data-screen="result"] .shelf button{color:#cfe0ea}

@media (min-width:600px){
  .roles{padding-inline-end:24px}
  .go{width:auto}
}
@media (max-width:430px){.reg .row{grid-template-columns:1fr}.reg svg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- scoring and matching ---------- */
function scoreAnswers(a){                 // a: 18 answers (1-5) in canonical order
  const s = {};
  DIMS.forEach((d,i)=>{ s[d] = a[i*3]+a[i*3+1]+a[i*3+2]; });
  const rank = DIMS.slice().sort((x,y)=> s[y]-s[x] || DIMS.indexOf(x)-DIMS.indexOf(y));
  const pct = {}; DIMS.forEach(d=>{ pct[d] = Math.round((s[d]-3)/12*100); });
  const emerging = s[rank[0]] <= 8;
  const dual = !emerging && (s[rank[0]] - s[rank[1]] <= 1);
  return {s, pct, top:rank[0], second:rank[1], dual, emerging};
}
function matchRoles(r, p){                // r: scoring result, p: {g,lvl,dom[],place,time}
  const pool = OPPS.map((o,i)=>{
    if(p.g==="m" && o.g==="f") return null;
    if(o.l > p.lvl) return null;
    let v = o.l===p.lvl ? 2 : 0.5;
    if(r.emerging){ if(o.c===0) v+=3; if(o.m.indexOf("P")>=0) v+=1; }
    else { if(o.m.indexOf(r.top)>=0) v+=3; if(o.m.indexOf(r.second)>=0) v+= r.dual?2.5:1; }
    if(p.g==="f" && o.g==="f") v+=1;
    if(p.dom.indexOf(o.d)>=0) v+=2.5;
    if((p.place==="in"&&o.p===0)||(p.place==="out"&&o.p===1)) v+=1;
    if(p.time==="low"||p.time==="season") v += o.c===0 ? 1 : -1;
    else if(p.time==="high") v += o.c===1 ? 1 : -0.5;
    return {o,i,v};
  }).filter(Boolean);
  const picked = [];
  while(picked.length<3 && pool.length){
    pool.forEach(c=>{ c.w = c.v - 1.5*picked.filter(x=>x.o.d===c.o.d).length; });
    pool.sort((x,y)=> y.w-x.w || x.i-y.i);
    picked.push(pool.shift());
  }
  return picked.map(c=>c.i);
}

function rose(pct, top, dark, second){
  const R=100, pts=[], lbl=[], ax=[];
  const P=(i,r)=>{ const a=(-90+i*60)*Math.PI/180; return [ +(r*Math.cos(a)).toFixed(1), +(r*Math.sin(a)).toFixed(1) ]; };
  const grid = dark?"rgba(255,255,255,.22)":"#cbd9e2", ink = dark?"#fff":"#0e2a3c", quiet = dark?"#9db9c9":"#55606a";
  let rings="";
  [1/3,2/3,1].forEach(f=>{ rings += `<polygon points="${DIMS.map((d,i)=>P(i,R*f).join(",")).join(" ")}" fill="none" stroke="${grid}" stroke-width="1"/>`; });
  DIMS.forEach((d,i)=>{
    const [x,y]=P(i,R); ax.push(`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="${grid}" stroke-width="1"/>`);
    if(pct) pts.push(P(i,R*Math.max(pct[d],6)/100).join(","));
    const [lx,ly]=P(i,R+16), side = Math.abs(lx)<5?"middle":(lx>0?"end":"start");
    const dy = i===0?-16:(i===3?14:0), hot = pct && (d===top || d===second);
    lbl.push(`<text x="${lx}" y="${ly+dy}" text-anchor="${side}" direction="rtl" font-family="Changa, sans-serif" font-size="14.5" font-weight="${hot?700:600}" fill="${hot?"#f3ab0d":ink}">${TYPES[d].name}</text>`
      + (pct?`<text x="${lx}" y="${ly+dy+17}" text-anchor="${side}" direction="rtl" font-size="12.5" font-weight="300" fill="${quiet}" font-family="Readex Pro, sans-serif">${pct[d]}%</text>`:""));
  });
  const shape = pct ? `<polygon points="${pts.join(" ")}" fill="#f3ab0d" fill-opacity=".26" stroke="#f3ab0d" stroke-width="2.5" stroke-linejoin="round"/>` : "";
  const needle = `<g class="needle" id="needle" style="transform:rotate(${pct?-150:-40}deg)"><polygon points="0,-78 9,0 0,14 -9,0" fill="#f3ab0d"/><polygon points="0,-78 0,14 -9,0" fill="#cf9105"/></g><circle r="5" fill="${dark?"#0e2a3c":"#fff"}" stroke="${dark?"#fff":"#0e2a3c"}" stroke-width="2"/>`;
  const alt = pct ? "مخطط الأبعاد الستة: " + DIMS.map(d=>`${TYPES[d].name} ${pct[d]} بالمئة`).join("، ") : "بوصلة الأنماط التطوعية الستة";
  return `<svg class="rose" viewBox="-205 -150 410 300" role="img" aria-label="${alt}">${rings}${ax.join("")}${shape}${needle}${lbl.join("")}</svg>`;
}

const CRC = (()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[i]=c>>>0; } return t; })();

  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.data, crc=crc32(data), n=data.length;
    const lh=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(n),u32(n),u16(name.length),u16(0)));

    off += lh.length+name.length+n;

  const col = n => { let s=""; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  let ncol=1; matrix.forEach(r=>{ ncol=Math.max(ncol,r.length); });
  const body = matrix.map((r,i)=>`<row r="${i+1}">`+r.map((v,j)=>{
      const ref=col(j)+(i+1);
      if(typeof v==="number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      const s = v==null ? "" : String(v);
      return s ? `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(s)}</t></is></c>` : "";
    }).join("")+`</row>`).join("");
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<sheetViews><sheetView rightToLeft="1" tabSelected="1" workbookViewId="0">`
    + `<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
    + `<cols><col min="1" max="${ncol}" width="22" customWidth="1"/></cols><sheetData>${body}</sheetData></worksheet>`;
  const book = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`
    + `<sheets><sheet name="${xe(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const F = (name,text)=>({name, data:enc.encode(text)});
  return zip([
    F("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`),
    F("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    F("xl/workbook.xml", book),
    F("xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`),
    F("xl/worksheets/sheet1.xml", sheet)
  ]);
}
function toCsv(matrix){
  const cell = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  return "﻿"+matrix.map(r=>r.map(cell).join(",")).join("\r\n");
}
async function handOver(filename, data, el){
  if(!downloads){ el.textContent="التنزيل غير متاح في هذا العرض. افتح الصفحة من claude.ai."; el.className="said warn"; return; }
  el.className="said"; el.textContent="جارٍ التجهيز…";
  try{ await downloads.save({filename, data}); el.textContent="تم حفظ "+filename; }
  catch(e){ el.className="said warn";
    el.textContent = e && e.code==="declined" ? "أُلغي التنزيل." : "تعذّر حفظ الملف من هذا العرض."; }
}
function report(){
  restartBtn.hidden=false; restartBtn.textContent="العودة للمقياس";
  let body;
  if(!capsReady){ body = `<p class="said">جارٍ التحميل…</p>`; }
  else if(!db || !canEdit){ body = `<p class="notice">التقرير متاح على جهاز مسجّل الدخول بحساب مالك الصفحة فقط.</p>`; }
  else if(R.err){ body = `<p class="notice">تعذّر الوصول إلى الإجابات الآن. تحقق من الاتصال ثم اضغط تحديث.</p>
      <div class="export"><div class="btns"><button type="button" id="refresh">تحديث</button></div></div>`; }
  else if(!R.rows){ body = `<p class="said">جارٍ تحميل الإجابات…</p>`; }
  else {
    const rows = R.rows.filter(inScope), n = rows.length;
    const tally = f => { const m={}; rows.forEach(r=>{ [].concat(f(r)).forEach(k=>{ m[k]=(m[k]||0)+1; }); }); return m; };
    const byTop = tally(r=>r.top), avg = d => n ? Math.round(rows.reduce((t,r)=>t+(((r.s||{})[d]||3)-3)/12*100,0)/n) : 0;
    const dist = k => { const m=tally(r=>r[k]); return Q[k].opts.map(o=>[o[1], m[o[0]]||0]); };
    const contacts = rows.filter(r=>(r.nm||"")||(r.ph||"")), dur = n ? Math.round(rows.reduce((t,r)=>t+(r.dur||0),0)/n/6)/10 : 0;
    const scopes = [["all","كل الإجابات"],["today","اليوم"],["event","يوم الملتقى"],["range","فترة محددة"]];
    body = `<div class="scopes">${scopes.map(([v,l])=>`<button type="button" data-scope="${v}" aria-pressed="${R.scope===v}">${l}</button>`).join("")}</div>`
      + (R.scope==="range" ? `<div class="range"><div class="field"><label for="from">من تاريخ</label>
            <input id="from" type="date" value="${R.from}" max="${todayISO()}"></div>
          <div class="field"><label for="to">إلى تاريخ</label><input id="to" type="date" value="${R.to}" max="${todayISO()}"></div></div>` : "")
      + (n ? `<div class="tiles"><div class="tile"><b>${n}</b><span>إجابة مكتملة</span></div>
            <div class="tile"><b>${contacts.length}</b><span>ترك بيانات تواصل</span></div>
            <div class="tile"><b>${dur}</b><span>متوسط المدة بالدقائق</span></div>
            <div class="tile"><b>${rows.filter(r=>r.dual).length}</b><span>نمط مزدوج</span></div></div>`
        + chart("النمط الأبرز عند الزوار", DIMS.map(d=>[TYPES[d].name, byTop[d]||0]).concat([[EMERGING.name, byTop.N||0]]), n)
        + chart("متوسط قوة كل دافع", DIMS.map(d=>[TYPES[d].name+" — "+TYPES[d].dim, avg(d), avg(d)+"%"]))
        + chart("مستوى التطوع", LEVELS.map((l,i)=>[l[0], rows.filter(r=>r.lvl===i).length]), n)
        + chart("المجالات المفضلة", dist("dom"), n) + chart("الجنس", dist("g"), n) + chart("الفئة العمرية", dist("age"), n)
        + chart("الخبرة التطوعية", dist("exp"), n) + chart("مكان التطوع المفضل", dist("place"), n) + chart("الوقت المتاح", dist("time"), n)
        : `<p class="notice">لا توجد إجابات في هذا النطاق بعد.</p>`)
      + `<div class="export"><h3>التصدير</h3>
          <p class="said">يشمل التصدير النطاق المحدد أعلاه: ${esc(scopeLabel())}، وعددها ${n} إجابة.</p>
          <div class="btns">
            <button type="button" id="xl" ${n?"":"disabled"}>ملف Excel</button>
            <button type="button" id="xlc" ${contacts.length?"":"disabled"}>قائمة التواصل (${contacts.length})</button>
            <button type="button" class="alt" id="csv" ${n?"":"disabled"}>CSV لجداول جوجل</button>
            <button type="button" class="alt" id="refresh">تحديث</button>
          </div><p class="said" id="msg"></p></div>`
      + `<p class="said">تُسجَّل الإجابات على الأجهزة المسجّلة بحساب الجمعية فقط. من يفتح الرابط دون تسجيل دخول يرى نتيجته كاملة ولا تُسجَّل إجابته.</p>`;
  }
  app.innerHTML = `<section class="report"><h2>تقرير بوصلة التطوع</h2>${body}</section>`;
  app.querySelectorAll("[data-scope]").forEach(b=>{ b.onclick=()=>{ R.scope=b.dataset.scope; report(); }; });
  ["from","to"].forEach(k=>{ const el=document.getElementById(k); if(el) el.onchange=()=>{ R[k]=el.value; report(); }; });
  const rf=document.getElementById("refresh"); if(rf) rf.onclick=loadReport;
  const rows = R.rows ? R.rows.filter(inScope) : [], msg = document.getElementById("msg");
  const stamp = R.scope==="range" ? (R.from||"start")+"_"+(R.to||todayISO()) : R.scope;
  const xl=document.getElementById("xl");
  if(xl) xl.onclick = ()=> handOver("volunteer-compass-"+stamp+".xlsx", new Blob([xlsx(reportMatrix(rows),"الإجابات")]), msg);
  const xlc=document.getElementById("xlc");
  if(xlc) xlc.onclick = ()=> handOver("volunteer-compass-contacts-"+stamp+".xlsx",
    new Blob([xlsx(contactMatrix(rows.filter(r=>(r.nm||"")||(r.ph||""))),"التواصل")]), msg);
  const cs=document.getElementById("csv");
  if(cs) cs.onclick = ()=> handOver("volunteer-compass-"+stamp+".csv", toCsv(reportMatrix(rows)), msg);
}

/* ---------- shell ---------- */
function reset(){ S=fresh(); render(); window.scrollTo(0,0); }
function render(){
  if(location.hash==="#report"){ document.body.dataset.screen="report";
    if(db && canEdit && !R.rows && !R.err){ loadReport(); } else { report(); } return; }
  document.body.dataset.screen = S.step;
  restartBtn.textContent="البدء من جديد"; restartBtn.hidden = S.step==="welcome";
  ({welcome:welcome,a:partA,b:partB,c:partC,d:partD,result:result})[S.step]();
  if(S.step!=="welcome") window.scrollTo(0,0);
  const f = document.getElementById(S.step==="b"?"statement":S.step==="result"?"rtitle":S.step==="d"?"dtitle":"");
  if(f) f.focus({preventScroll:true});
}
restartBtn.onclick = ()=>{ if(location.hash==="#report"){ location.hash=""; R.rows=null; } reset(); };
window.addEventListener("hashchange", ()=>{ R.rows=null; R.err=null; render(); });
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-k]"); if(!b) return;
  const k=b.dataset.k, raw=b.dataset.v, v = k==="lvl" ? +raw : raw;
  if(k==="dom"){ const i=S.dom.indexOf(v); if(i>=0) S.dom.splice(i,1); else if(S.dom.length<3) S.dom.push(v); }
  else S[k]=v;
  const y = window.scrollY; render(); window.scrollTo(0,y);
});
document.addEventListener("keydown", e=>{
  if(S.step==="b" && location.hash!=="#report" && e.key>="1" && e.key<="5"){
    const b=app.querySelector(`.dial button[data-val="${e.key}"]`); if(b) b.click();
  }
});
/* booth devices return to the opening screen after three idle minutes */
let idle; const poke=()=>{ clearTimeout(idle); idle=setTimeout(()=>{ if(S.step!=="welcome" && location.hash!=="#report") reset(); },180000); };
["pointerdown","keydown","scroll"].forEach(ev=>window.addEventListener(ev,poke,{passive:true})); poke();
/* keep a respondent's place if the page is republished mid-answer */
const start = d => { if(d && d.step){ S = Object.assign(fresh(), d); } render(); };
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(()=>S);
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
</script>
